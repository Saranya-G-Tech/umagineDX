<!DOCTYPE html>

<style>
body {

  background: linear-gradient(135deg, #1e3a8a, #2563eb);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.login-box {
  background: white;
  padding: 30px;
  width: 350px;
  border-radius: 10px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
  text-align: center;
}

.login-box h2 {
  color: #1e3a8a;
  margin-bottom: 20px;
}

.login-box input {
  width: 90%;
  padding: 10px;
  margin: 10px 0;
  border-radius: 5px;
  border: 1px solid #ccc;
}

.login-box button {
  width: 100%;
  padding: 12px;
  background: linear-gradient(135deg, #16a34a, #22c55e);
  border: none;
  color: white;
  font-size: 16px;
  border-radius: 25px;
  cursor: pointer;
  font-weight: bold;
}

.login-box button:hover {
  transform: scale(1.05);
}

.login-box p {
  font-size: 14px;
  color: #555;
}
</style>
