<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Donor Login | UmagineDX</title>

  <!-- CSS file link -->
  <link rel="stylesheet" href="login.css">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <h2><i class="fa-solid fa-user-lock"></i> Donor Login</h2>

      <input type="text" placeholder="Full Name" required>
      <input type="email" placeholder="Email Address" required>

      <button onclick="openForm()">Continue to Donation Form</button>

      <p>Your details are secure and used only for coordination.</p>
    </div>
  </div>

  <script>
    function openForm() {
      window.location.href = "https://docs.google.com/forms/d/e/1FAIpQLSecYbyxk-mWgAh397qFMozY6S0CK3iLUoT9CKM3TA9zCdj5EQ/viewform?usp=publish-editor";
    }
  </script>

</body>
</html>
